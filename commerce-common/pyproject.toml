[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "commerce-common"
version = "0.1.0.dev0"
description = "What both commerce agent roles build on: config, fencing, memory, skills, grounding, presentation, the executor frame, and the event protocol."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
classifiers = ["License :: OSI Approved :: Apache Software License"]
authors = [{ name = "Anthropic" }]
dependencies = [
  "commerce-model-runtime==0.1.0.dev0",
  "pydantic>=2.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
sdk = ["claude-agent-sdk>=0.2.139", "mcp>=1.2"]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.15,<0.17", "httpx>=0.27", "mcp>=1.2"]
examples = [
  "fastapi>=0.132",
  "uvicorn>=0.30",
  "python-dotenv>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["commerce_common"]
